	<main>
    <h2>Contact Form</h2>
    <form action="https://httpbin.org/post" method="POST">
        <fieldset>
            <legend>Contact Information</legend>
            <input type="hidden" name="possible_bot" value="true">
            <label for="form-name">Name:</label>
            <input type="text" id="form-name" name="form-name" autocomplete="name"><br>
            <label for="form-email">Email Address:</label>
            <input type="email" id="form-email" name="form-email" autocomplete="email"><br><br>
			<textarea id="form-message" name="form-message" rows="3"></textarea><br>
            <button type="submit">Submit</button>
        </fieldset>
      </form>
  </main>
